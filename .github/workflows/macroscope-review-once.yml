name: macroscope-review-once

# After Macroscope finishes its first correctness review on a PR, apply the
# skip label so subsequent pushes don't get auto-reviewed. To re-review on
# demand, comment `@macroscope-app review` (it bypasses the skip label).
on:
  check_run:
    types: [completed]

permissions:
  pull-requests: write

jobs:
  apply-skip-label:
    if: ${{ github.event.check_run.name == 'Macroscope - Correctness Check' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const SKIP_LABEL = 'macroscope-skip'; // must match skip_labels in Macroscope settings
            for (const pr of context.payload.check_run.pull_requests || []) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [SKIP_LABEL],
              });
            }
